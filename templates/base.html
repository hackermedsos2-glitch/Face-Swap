<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Faceswap App{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; background: #eef; }
        form p { margin-bottom: 12px; }
        input[type=text], input[type=email], input[type=password] {
            width: 100%; padding: 8px; box-sizing: border-box;
        }
        button { padding: 10px 16px; }
    </style>
</head>
<body>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
